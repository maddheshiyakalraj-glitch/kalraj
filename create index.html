<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PMSM 3D Virtual Lab</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

  <header>
    <h1>PMSM Virtual Lab</h1>
    <p>Permanent Magnet Synchronous Motor</p>
  </header>

  <main>
    <div id="motor-canvas"></div>

    <aside>
      <h2>Motor Control</h2>
      <button id="start-btn">Start Motor</button>
      <button id="stop-btn">Stop Motor</button>

      <label>Motor Speed</label>
      <input id="speed" type="range" min="0" max="20" value="5">

      <p>Speed: <span id="speed-value">5</span></p>
      <p>Status: <span id="status">Stopped</span></p>
    </aside>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
